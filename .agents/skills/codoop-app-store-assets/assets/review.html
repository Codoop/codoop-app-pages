<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Store · Asset Review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f2f7;color:#232841;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,select,input{font:inherit}button,select{cursor:pointer}.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:18px 30px;background:#fffffff2;border-bottom:1px solid #e1e3ed;backdrop-filter:blur(18px)}.identity{font-size:15px;font-weight:750}.identity small{display:block;margin-top:5px;color:#8990a5;font-size:12px;font-weight:400}.filters{display:flex;gap:4px;padding:4px;background:#eff0f7;border-radius:12px;margin-left:auto}.filters button{border:0;border-radius:9px;background:transparent;color:#6e7691;padding:9px 14px}.filters button[aria-pressed=true]{background:#4b5bd6;color:white}.zoom{display:flex;align-items:center;gap:8px;color:#7d859e;font-size:12px}.zoom select{padding:7px;border:1px solid #dfe2ef;border-radius:8px;background:white;color:#424a66}.intro{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:32px 32px 0}.intro h1{margin:0;font-size:22px;letter-spacing:-.04em}.intro p{margin:8px 0 0;font-size:13px;color:#8990a5}.badge{padding:7px 11px;border:1px solid #e0e3ee;border-radius:99px;color:#858ca3;background:#fff;font-size:11px}.gallery{display:flex;flex-wrap:wrap;align-items:start;justify-content:center;gap:32px;padding:32px}.artwork{width:calc(var(--w)*var(--scale)*1px)}.artwork[hidden]{display:none}.frame{width:calc(var(--w)*var(--scale)*1px);height:calc(var(--h)*var(--scale)*1px);overflow:hidden;box-shadow:0 18px 45px #30386221;border-radius:5px}.canvas{position:relative;isolation:isolate;overflow:hidden;width:calc(var(--w)*1px);height:calc(var(--h)*1px);transform:scale(var(--scale));transform-origin:top left;background:linear-gradient(155deg,#fbfbff,#eff1ff 52%,#e0e6ff);color:#252b4d}.canvas:before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 65% 75%,#bfcaffaa,transparent 55%)}.canvas:after{content:"";position:absolute;z-index:-1;inset:0;background-image:radial-gradient(circle,#7585d8 2px,transparent 3px);background-size:44px 44px;opacity:.14;mask-image:linear-gradient(transparent,black 35%,black 85%,transparent)}.copy{position:absolute;z-index:2}.eyebrow{display:flex;align-items:center;gap:18px;color:#8790b0;font-size:28px;font-weight:700;letter-spacing:3px}.eyebrow:before{content:"";width:14px;height:14px;background:#5364db;border-radius:50%}.headline{margin:42px 0 0;font-size:112px;line-height:1.2;letter-spacing:-5px}.headline em{color:#4d5eda;font-style:normal}.description{margin:30px 0 0;font-size:39px;line-height:1.5;color:#7e88a6}.phone{position:absolute;padding:13px;border-radius:122px;background:linear-gradient(125deg,#cbd0df,#fafbff 28%,#a3acc2 66%,#eef0fa);box-shadow:0 35px 85px #36416a30,inset 0 0 0 2px #fff}.screen{overflow:hidden;border:6px solid #272b3d;border-radius:106px;background:#f8f9ff}.screen img{display:block;width:100%;height:auto}.placeholder{display:grid;place-content:center;text-align:center;aspect-ratio:9/19.5;background:linear-gradient(160deg,#f8f9ff,#e9edff);color:#8c96b8;font-size:30px;line-height:1.6}.placeholder strong{font-size:38px;color:#5665a0}.portrait .copy{top:165px;left:100px;right:90px}.portrait .phone{top:800px;left:109px;width:961px}.landscape .copy{left:6.8%;top:16%;width:43%}.landscape .headline{font-size:185px;line-height:1.2;letter-spacing:-6px}.landscape .description{font-size:57px;margin-top:45px}.landscape .eyebrow{font-size:40px}.landscape .phone{width:21%;top:4%;left:44%;transform:rotate(-4deg)}.landscape .phone.second{left:67%;top:12%;width:20%;transform:rotate(4deg)}.search .headline{font-size:98px;letter-spacing:-3px;margin-top:30px}.search .description{font-size:38px;margin-top:28px}.search .eyebrow{font-size:24px}.search .phone{padding:8px;border-radius:70px;width:28%;left:48%;top:8%}.search .screen{border-width:4px;border-radius:57px}.search .phone.second{width:23%;left:75%;top:18%}.search .placeholder{font-size:18px}.search .placeholder strong{font-size:22px}.label{display:flex;justify-content:space-between;gap:10px;margin-top:12px;color:#78819e;font-size:12px}.label a{color:#5262d3;text-decoration:none}.single .toolbar,.single .intro,.single .label{display:none}.single .gallery{display:block;padding:0}.single .artwork{--scale:1!important}.single .frame{box-shadow:none;border-radius:0}.single{background:white}@media(max-width:800px){.toolbar{padding:16px;gap:14px}.filters{margin-left:0;order:3;width:100%}.intro{margin:24px 20px 0}.gallery{padding:24px 20px;justify-content:start;overflow:auto}}
</style></head>
<body>
<header class="toolbar"><div class="identity">APP STORE / DESIGN REVIEW<small>Asset review · Example template</small></div><nav class="filters" aria-label="Asset type"><button data-filter="all" aria-pressed="true">All assets</button><button data-filter="portrait" aria-pressed="false">Portraits</button><button data-filter="landscape" aria-pressed="false">Landscape</button></nav><label class="zoom">Zoom <select id="zoom"><option value=".12">12%</option><option value=".18" selected>18%</option><option value=".25">25%</option><option value=".4">40%</option><option value=".6">60%</option><option value="1">100%</option></select></label></header>
<div class="intro"><div><h1>Let the product take center stage.</h1><p>Replace the example copy and screenshots, and adapt the design to the product. Open any card at full size.</p></div><span class="badge">DESIGN REVIEW · NOT EXPORTED</span></div><main class="gallery" id="gallery"></main>
<script>
// Example dimensions are not upload specifications. Replace copy, paths and styles for each product.
// Paths may contain spaces; keep source images alongside the generated review and do not overwrite them.
const designs=[
 {id:'01',kind:'portrait',name:'Product overview',w:1179,h:2556,eyebrow:'YOUR PRODUCT / 01',title:'Turn inspiration',accent:'into action',desc:'Describe the core value clearly and accurately.',images:[]},
 {id:'02',kind:'portrait',name:'Core feature',w:1179,h:2556,eyebrow:'YOUR PRODUCT / 02',title:'Start with',accent:'an idea',desc:'Explain the feature shown in the screenshot.',images:[]},
 {id:'03',kind:'portrait',name:'Product experience',w:1179,h:2556,eyebrow:'YOUR PRODUCT / 03',title:'Make every step',accent:'feel simple',desc:'Keep the copy concise and true to the product.',images:[]},
 {id:'header',kind:'landscape',name:'Product page header',w:3840,h:1646,eyebrow:'YOUR PRODUCT',title:'Give every idea',accent:'a next step',desc:'Tell the product story with real screens.',images:[]},
 {id:'search',kind:'landscape search',name:'Search Results',w:1920,h:1280,eyebrow:'YOUR PRODUCT',title:'Start inspired',accent:'move forward',desc:'Introduce the product’s main value.',images:[]}
];
const gallery=document.querySelector('#gallery'),zoom=document.querySelector('#zoom'),buttons=[...document.querySelectorAll('[data-filter]')];
function phone(src,second){const p=document.createElement('div');p.className='phone'+(second?' second':'');const screen=document.createElement('div');screen.className='screen';if(src){const img=document.createElement('img');img.src=src;img.alt='Actual product screenshot';screen.append(img)}else{const ph=document.createElement('div');ph.className='placeholder';ph.innerHTML='<strong>Real screenshot</strong><span>Replace with your app screen</span>';screen.append(ph)}p.append(screen);return p}
function build(){designs.forEach(d=>{const card=document.createElement('section');card.className='artwork';card.dataset.id=d.id;card.dataset.kind=d.kind;card.style.cssText=`--w:${d.w};--h:${d.h};--scale:${zoom.value}`;const frame=document.createElement('div');frame.className='frame';const canvas=document.createElement('article');canvas.className='canvas '+d.kind;const copy=document.createElement('div');copy.className='copy';const eyebrow=document.createElement('div');eyebrow.className='eyebrow';eyebrow.textContent=d.eyebrow;const title=document.createElement('h2');title.className='headline';title.append(document.createTextNode(d.title),document.createElement('br'));const em=document.createElement('em');em.textContent=d.accent;title.append(em);const desc=document.createElement('p');desc.className='description';desc.textContent=d.desc;copy.append(eyebrow,title,desc);canvas.append(copy,phone(d.images[0],false));if(d.kind.includes('landscape'))canvas.append(phone(d.images[1],true));frame.append(canvas);const label=document.createElement('div');label.className='label';const text=document.createElement('span');text.textContent=`${d.id.toUpperCase()} · ${d.name} · ${d.w} × ${d.h}`;const link=document.createElement('a');link.href='?slide='+encodeURIComponent(d.id);link.target='_blank';link.textContent='Full size ↗';label.append(text,link);card.append(frame,label);gallery.append(card)})}
build();const cards=[...document.querySelectorAll('.artwork')];function filter(id){cards.forEach(c=>c.hidden=id!=='all'&&!c.dataset.kind.includes(id));buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===id)))}buttons.forEach(b=>b.onclick=()=>filter(b.dataset.filter));zoom.onchange=()=>cards.forEach(c=>c.style.setProperty('--scale',zoom.value));const slide=new URLSearchParams(location.search).get('slide');if(cards.some(c=>c.dataset.id===slide)){document.body.classList.add('single');cards.forEach(c=>c.hidden=c.dataset.id!==slide)}
</script></body></html>
